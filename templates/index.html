<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Buxgalteriya Qidiruv Tizimi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; width: 100%; max-width: 700px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #1e293b; font-size: 24px; margin-bottom: 8px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .sync-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 24px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button.sync-btn { background: #0f172a; }
        button.sync-btn:hover { background: #334155; }
        .results { border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .result-item { background: #f8fafc; border-left: 4px solid #2563eb; padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 12px; }
        .result-title { font-weight: bold; color: #0f172a; margin-bottom: 4px; }
        .result-text { color: #475569; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buxgalteriya Qidiruv Tizimi</h1>
        <p class="subtitle">Dropbox va Gemini AI yordamida aqlli hujjatlar qidiruvi</p>
        
        <div class="sync-section">
            <span>Dropbox fayllarini sinxronlash:</span>
            <button class="sync-btn" onclick="syncFiles()">Sinxronlash</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buxgalteriya hujjatidan qidiruv kiriting...">
            <button onclick="searchDocs()">Qidirish</button>
        </div>

        <div class="results" id="resultsBox">
            <p style="color: #94a3b8; text-align: center;">Natijalar bu yerda ko'rinadi</p>
        </div>
    </div>

    <script>
        async function syncFiles() {
            const resBox = document.getElementById('resultsBox');
            resBox.innerHTML = '<p style="color: #2563eb;">Dropbox bilan sinxronizatsiya ketmoqda...</p>';
            try {
                const res = await fetch('/sync', { method: 'POST' });
                const data = await res.json();
                alert(data.message || 'Sinxronizatsiya yakunlandi!');
                resBox.innerHTML = '<p style="color: #94a3b8; text-align: center;">Sinxronizatsiya muvaffaqiyatli o‘tdi.</p>';
            } catch (e) {
                alert('Xatolik yuz berdi!');
            }
        }

        async function searchDocs() {
            const query = document.getElementById('searchInput').value;
            if(!query) return alert('Qidiruv matnini kiriting!');
            
            const resBox = document.getElementById('resultsBox');
            resBox.innerHTML = '<p style="color: #2563eb;">Qidirilmoqda...</p>';
            
            try {
                const res = await fetch(`/search?query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if(data.results && data.results.length > 0) {
                    resBox.innerHTML = data.results.map(item => `
                        <div class="result-item">
                            <div class="result-title">📄 ${item.file_name}</div>
                            <div class="result-text">${item.content}</div>
                        </div>
                    `).join('');
                } else {
                    resBox.innerHTML = '<p style="color: #94a3b8; text-align: center;">Hujjat topilmadi.</p>';
                }
            } catch (e) {
                resBox.innerHTML = '<p style="color: #ef4444; text-align: center;">Xatolik yuz berdi.</p>';
            }
        }
    </script>
</body>
</html>
