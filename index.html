<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buxgalteriya Hujjatlarini Qidirish Tizimi</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Card Styles */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            margin-bottom: 20px;
        }

        /* Auth Screen */
        #auth-screen {
            max-width: 420px;
            margin: 0 auto;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text);
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-sync {
            background-color: #059669;
            width: auto;
            padding: 10px 18px;
            font-size: 14px;
        }

        .btn-sync:hover {
            background-color: #047857;
        }

        .btn-logout {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #fca5a5;
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-logout:hover {
            background-color: #fef2f2;
        }

        /* Main Dashboard */
        #app-screen {
            display: none;
            width: 100%;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box button {
            width: 120px;
        }

        /* Sync section */
        .sync-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sync-box input {
            flex: 1;
            background: white;
        }

        /* Results */
        .results-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .result-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .file-name:hover {
            text-decoration: underline;
        }

        .score-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .preview-text {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
        }

        /* Helper Classes */
        .hidden { display: none !important; }
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .success-msg {
            color: #16a34a;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGIN SCREEN -->
        <div id="auth-screen" class="card">
            <h1 class="auth-title">Tizimga Kirish</h1>
            <p class="auth-subtitle">Buxgalteriya AI qidiruv platformasi</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Login (Foydalanuvchi nomi)</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Parol</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn">Kirish</button>
                <div id="auth-error" class="error-msg hidden"></div>
            </form>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="app-screen" class="container">
            <div class="card">
                <div class="header-bar">
                    <div>
                        <h2>Buxgalteriya Hujjatlari Qidiruvi</h2>
                        <span style="font-size: 12px; color: var(--text-muted);">Bulutli va AI bazasidagi semantik izlash</span>
                    </div>
                    <div class="user-info">
                        <span id="user-display" style="font-weight: 600; font-size: 14px;"></span>
                        <button class="btn-logout" onclick="logout()">Chiqish</button>
                    </div>
                </div>

                <!-- Sync Box -->
                <div class="sync-box">
                    <input type="text" id="folder-id" placeholder="Dropbox papka yo'li (Masalan: /Buxgalteriya/2026)">
                    <button class="btn-sync" onclick="syncDropbox()">Indekslash</button>
                </div>
                <div id="sync-status" class="success-msg hidden" style="margin-bottom: 15px;"></div>

                <!-- Search Form -->
                <div class="search-box">
                    <input type="text" id="search-query" placeholder="Hujjat mazmuni, rekvizit, INN yoki kalit so'zni kiriting..." onkeypress="handleKeyPress(event)">
                    <button onclick="performSearch()" id="search-btn">Qidirish</button>
                </div>

                <!-- Search Results -->
                <div id="results-container">
                    <div id="results-list"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // BACKEND URL: index.html endi FastAPI'ning o'zidan xizmat qiladi,
        // shuning uchun bo'sh qoldiramiz — barcha so'rovlar shu domenning o'ziga ketadi.
        const BACKEND_URL = "";

        // Login Submit
        document.getElementById("login-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("auth-error");
            const loginBtn = document.getElementById("login-btn");

            errorDiv.classList.add("hidden");
            loginBtn.innerHTML = '<span class="loader"></span> Kirilmoqda...';

            try {
                const response = await fetch(`${BACKEND_URL}/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ username, password })
                });

                if (!response.ok) {
                    throw new Error("Login yoki parol noto'g'ri!");
                }

                const data = await response.json();
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("username", username);
                
                showApp();
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove("hidden");
            } finally {
                loginBtn.innerText = "Kirish";
            }
        });

        // App Screen'ni ko'rsatish
        function showApp() {
            const token = localStorage.getItem("access_token");
            if (!token) return;

            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";
            document.getElementById("user-display").innerText = "👤 " + localStorage.getItem("username");
        }

        // Chiqish (Logout)
        function logout() {
            localStorage.clear();
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("auth-screen").style.display = "block";
            document.getElementById("login-form").reset();
        }

        // Search funksiyasi
        async function performSearch() {
            const query = document.getElementById("search-query").value.trim();
            const btn = document.getElementById("search-btn");
            const resultsList = document.getElementById("results-list");
            const token = localStorage.getItem("access_token");

            if (!query) return;

            btn.innerHTML = '<span class="loader"></span>';
            resultsList.innerHTML = "";

            try {
                const response = await fetch(`${BACKEND_URL}/search?query=${encodeURIComponent(query)}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert("Sessiya muddati tugadi. Qayta kiring.");
                    logout();
                    return;
                }

                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    resultsList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Ushbu so'rov bo'yicha mos keluvchi fayllar topilmadi.</p>';
                    return;
                }

                let html = `<h3 class="results-title">Qidiruv natijalari (${data.results.length} ta fayl topildi):</h3>`;
                data.results.forEach(item => {
                    html += `
                        <div class="result-item">
                            <div class="result-header">
                                <a href="${item.file_link}" target="_blank" class="file-name">📄 ${item.file_name}</a>
                                <span class="score-badge">O'xshashlik: ${item.similarity_score}%</span>
                            </div>
                            <div class="preview-text">${item.preview || 'Matnli ko'rinish mavjud emas.'}</div>
                        </div>
                    `;
                });
                resultsList.innerHTML = html;

            } catch (err) {
                resultsList.innerHTML = `<p class="error-msg">Qidiruvda xatolik yuz berdi: ${err.message}</p>`;
            } finally {
                btn.innerText = "Qidirish";
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") performSearch();
        }

        // Dropbox Indekslash
        async function syncDropbox() {
            const folderPath = document.getElementById("folder-id").value.trim();
            const statusDiv = document.getElementById("sync-status");
            const token = localStorage.getItem("access_token");

            if (!folderPath) {
                alert("Iltimos, Dropbox papka yo'lini kiriting (masalan: /Buxgalteriya)!");
                return;
            }

            statusDiv.classList.remove("hidden");
            statusDiv.innerText = "⏳ Indekslash orqa fonda boshlandi...";

            try {
                const response = await fetch(`${BACKEND_URL}/sync?folder_path=${encodeURIComponent(folderPath)}`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    statusDiv.innerText = "✅ Dropbox fayllarini indekslash orqa fonda muvaffaqiyatli boshlandi!";
                } else {
                    statusDiv.innerText = "❌ Indekslashni boshlashda xatolik yuz berdi.";
                }
            } catch (err) {
                statusDiv.innerText = "❌ Xatolik: " + err.message;
            }
        }

        // Sahifa yuklanganda sessiyani tekshirish
        window.onload = function() {
            if (localStorage.getItem("access_token")) {
                showApp();
            }
        };
    </script>
</body>
</html>
